<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@kfonts/line-seed-sans-kr@0.1.0/index.min.css">
    <meta charset="utf-8" />
    <meta name="naver-site-verification" content="1af88f1f8485f61824dd14cbf4759c9ce29d713d" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>키오스쿨</title>
    <style>
      #app-splash {
        display: none;
      }

      html[data-app-shell] #root {
        visibility: hidden;
      }

      html[data-app-shell] body {
        overflow: hidden;
      }

      html[data-app-shell] #app-splash {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        background-color: #ffffff;
      }

      #app-splash-logo {
        width: 56px;
        height: 56px;
      }

      #app-splash-spinner {
        width: 22px;
        height: 22px;
        border: 3px solid #ffe7d3;
        border-top-color: #ff9142;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }

      #app-splash-note {
        margin: 0;
        padding: 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #8b95a1;
        text-align: center;
        word-break: keep-all;
      }

      #app-splash-retry {
        display: none;
        margin: 0;
        padding: 10px 28px;
        border: none;
        border-radius: 999px;
        background-color: #ff9142;
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body class="notranslate">
    <script>
      // 프리렌더된 index.html 은 SPA fallback 문서이기도 하다. 다른 경로로 서빙됐으면 페인트 전에 감춘다.
      // 아래 문자열들은 src/constants/appShell.ts 와 동일해야 한다.
      (function () {
        var meta = document.querySelector('meta[name="x-prerendered-path"]');
        var prerenderedPath = meta ? meta.getAttribute('content') : null;
        var currentPath = location.pathname.replace(/\/+$/, '') || '/';

        if (prerenderedPath === currentPath) return;

        document.documentElement.setAttribute('data-app-shell', '');

        var SLOW_NETWORK_NOTICE_DELAY_MS = 10000;
        var hasFailed = false;

        function isRevealed() {
          return !document.documentElement.hasAttribute('data-app-shell');
        }

        function setNote(text) {
          var note = document.getElementById('app-splash-note');
          if (note) note.textContent = text;
        }

        // 브라우저는 받다 만 응답을 캐시하지 않는다. 느릴 뿐인데 새로고침을 권하면 받아둔 걸 버리게 되므로,
        // 실제 로드 실패를 확인했을 때만 권한다.
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (!target || target.tagName !== 'SCRIPT' || isRevealed()) return;

            hasFailed = true;
            setNote('불러오지 못했어요.');

            var spinner = document.getElementById('app-splash-spinner');
            if (spinner) spinner.style.display = 'none';

            var retry = document.getElementById('app-splash-retry');
            if (retry) retry.style.display = 'block';
          },
          true,
        );

        window.setTimeout(function () {
          if (hasFailed || isRevealed()) return;

          setNote('네트워크가 느려 조금 더 걸리고 있어요.');
        }, SLOW_NETWORK_NOTICE_DELAY_MS);

        document.addEventListener('DOMContentLoaded', function () {
          var retry = document.getElementById('app-splash-retry');
          if (retry) retry.addEventListener('click', function () { location.reload(); });
        });
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="app-splash" role="status" aria-live="polite">
      <img id="app-splash-logo" src="/logo192.png" alt="" width="56" height="56" aria-hidden="true" />
      <div id="app-splash-spinner" aria-hidden="true"></div>
      <p id="app-splash-note">메뉴를 불러오는 중이에요</p>
      <button id="app-splash-retry" type="button">새로고침</button>
    </div>
    <div id="kioschool-modal-root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
