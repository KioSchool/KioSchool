<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>문의 답변</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f6f7f9; font-family: 'Apple SD Gothic Neo', 'NanumGothic', 'Malgun Gothic', 'Inter', sans-serif">
    <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px">
      <h1 style="margin: 0 0 24px; font-size: 20px; color: #111827">문의 답변드립니다</h1>
      <div style="font-size: 14px; line-height: 1.7; color: #374151; white-space: pre-wrap; overflow-wrap: anywhere" th:text="${content}">답변 내용</div>
      <p style="margin: 32px 0 0; font-size: 12px; color: #9ca3af">
        추가로 궁금한 점이 있으면
        <a th:href="${baseUrl}" style="color: #6b7280" href="https://kio-school.com">키오스쿨</a>에서 새 문의를 남겨주세요.
      </p>
    </div>
  </body>
</html>
