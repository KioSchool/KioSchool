<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>키오스쿨</title>
</head>
<body style="margin:0;padding:24px;background:#f6f7f9;font-family:'Apple SD Gothic Neo', 'NanumGothic', 'Malgun Gothic', 'Inter', sans-serif;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
  <div style="font-size:14px;line-height:1.7;color:#374151;overflow-wrap:anywhere;" th:utext="${contentHtml}">내용</div>

  <p th:if="${button != null}" style="margin:24px 0 0;">
    <a th:href="${button.url}" th:text="${button.label}"
       style="display:inline-block;padding:12px 20px;background:#eb6d09;border-radius:8px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;">버튼</a>
  </p>

  <p th:if="${unsubscribeUrl != null}" style="margin:32px 0 0;font-size:12px;color:#9ca3af;">
    이런 메일을 그만 받으려면 <a th:href="${unsubscribeUrl}" style="color:#6b7280;">수신 거부</a>를 눌러 주세요.
  </p>
</div>
</body>
</html>
